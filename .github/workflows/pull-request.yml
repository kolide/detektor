name: Pull request

on:
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # Audit network and disk activity

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        bundler-cache: true
    - name: Lint
      run: bundle exec standardrb --format github
    - name: Test
      run: bundle exec rspec --format documentation --format json --out spec/reports/results.json
    
    - name: Report
      if: ${{ !cancelled() }}
      run: 'bundle exec rake ci:test_report'