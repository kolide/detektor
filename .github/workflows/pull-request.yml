name: Pull request

on:
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1 # v1.146.0
      with:
        bundler-cache: true
    - name: Mise
      uses: jdx/mise-action@v2
      with:
        install: false
    - name: Lint
      run: standardrb --format github
    - name: Test
      run: rspec --format documentation --format json --out spec/reports/results.json
    
    - name: Report
      if: ${{ !cancelled() }}
      run: 'rake ci:test_report'